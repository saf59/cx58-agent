[package]
name = "cx58-agent"
version = "0.1.0"
edition = "2024"

[dependencies]
# Core async runtime
tokio = { version = "1", features = ["full"] }

# Web framework
axum = { version = "0.8.8", features = ["multipart"] }
# tower = { version = "0.5", features = ["limit"] }
tower-http = { version = "0.6", features = ["cors", "fs", "trace", "limit"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"

# Database
sqlx = { version = "0.8", features = [
    "postgres",
    "runtime-tokio-rustls",
    "uuid",
    "macros",
    "chrono",
    "json",
    "migrate"
] }

# Redis
# redis = { version = "1", features = ["tokio-comp", "connection-manager"] }

# S3 Storage - ULTRA LIGHTWEIGHT! 🚀
# Only ~50KB + reqwest (~200KB) = Total ~250KB
rust-s3 = { version = "0.37", default-features = false, features = ["tokio-native-tls"] }

# AI/LLM
rig-core = "0.32"

# Utilities
uuid = { version = "1", features = ["serde", "v7"] }
chrono = { version = "0.4", features = ["serde"] }
bytes = "1"
futures = "0.3"
# tokio-stream = "0.1"
async-stream = "0.3"
thiserror = "2.0"

# HTTP client (already needed for Ollama)
reqwest = { version = "0.13", features = ["json", "stream", "multipart"] }

# Image processing
image = "0.25"
mime_guess = "2"

# Hashing
sha2 = "0.10"
hex = "0.4"

# Base64 for Ollama vision
base64 = "0.22"

# Config
dotenv = "0.15"
#env_logger = "0.11"
#log = "0.4"

# lang
fluent-bundle = "0.16"
unic-langid = { version = "0.9", features = ["macros"] }
# schemars = "1.2.0"
aho-corasick = "1.1"
strum = "0.28"
strum_macros = "0.28"
tracing = "0.1"
hmac = "0.12"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
tera = "1.20"
anyhow = "1"
fluent-syntax = "0.12"
rand = "0.10"# ""0.9.2"
unicode-segmentation = "1.12.0"

[dev-dependencies]
# tokio-test = "0.4"
